metadata:
  { logo_img: "asset:BMAAutoAccessories.ico", title: BMA Auto Accessories }
name: BMALocal
native_deps:
  head_html: |+
    <script>
        function replaceBanner(){
            var els = [].slice.apply(document.getElementsByClassName("anvil-show-banner"));
            for (var i = 0; i < els.length; i++) {
                els[i].className = els[i].className.replace(/ *\banvil-show-banner\b/g, " ");
            }
        }
        window.setWtChatOpenStatus = window.setWtChatOpenStatus || function(){};
        window.clearWtUnreadCount = window.clearWtUnreadCount || function(){};
        window.disconnectWtChat = window.disconnectWtChat || function(){};
        window.scrollWtChatToBottom = window.scrollWtChatToBottom || function(){};
    </script>
    <script src="_/theme/walkietalkie.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mozilla+Headline:wght@200..700&display=swap" rel="stylesheet">

package_name: BMALocal
runtime_options:
  client_version: "3"
  server_spec: { base: python310-standard }
  server_spec_disabled: { base: python310-minimal, requirements: "" }
  server_version: python3-sandbox
  version: 2
secrets: {}
services:
  - client_config: {}
    server_config: {}
    source: /runtime/services/tables.yml
  - client_config:
      {
        allow_signup: true,
        confirm_email: false,
        enable_automatically: false,
        mfa_timeout_days: 0,
        require_mfa: false,
        require_secure_passwords: true,
        use_email: true,
      }
    server_config:
      email_content:
        reset_password:
          html: |-
            <p>Hi there,</p>
            <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
            <p>{{reset_link}}</p>
            <p>This link will expire in ten minutes.</p>
      user_table: users
    source: /runtime/services/anvil/users.yml
  - client_config: {}
    server_config: {}
    source: /runtime/services/anvil/secrets.yml
startup: { module: Launcher, type: form }
startup_form: null
uplink_visible: true
